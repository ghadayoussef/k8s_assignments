# kubectl create namespace monitoring
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          ports:
            - containerPort: 9100

# kubectl get nodes
# kubectl get ds -n monitoring
# kubectl get pods -n monitoring -o wide

# Step 4: Update the image
# kubectl set image ds/node-exporter -n monitoring node-exporter=prom/node-exporter:v1.8.2
# kubectl annotate ds/node-exporter -n monitoring kubernetes.io/change-cause="update to v1.8.2"
# kubectl get ds node-exporter -n monitoring -o jsonpath='{.metadata.annotations}'

# annotate
# It attaches a note (an annotation) to the DaemonSet object. Annotations are key-value pairs in metadata.annotations. Unlike labels, they aren’t used for selecting objects. They hold extra information that people or tools read.

# Breaking down the command:

# ds/node-exporter -n monitoring is the object to annotate.
# kubernetes.io/change-cause is the key. This is a special, well-known key.
# "update to v1.8.2" is the value, which can be any text you like.

# After running it, the object contains:

# yaml
# metadata:
#   annotations:
#     kubernetes.io/change-cause: "update to v1.8.2"

# Check it with:
# kubectl get ds node-exporter -n monitoring -o jsonpath='{.metadata.annotations}'



# Step 5: Observe the rolling update
# In separate terminals:

# kubectl rollout status ds/node-exporter -n monitoring
# kubectl get pods -n monitoring -o wide -w

# kubectl get controllerrevisions -n monitoring
# kubectl rollout history ds/node-exporter -n monitoring

# kubectl rollout undo ds/node-exporter -n monitoring